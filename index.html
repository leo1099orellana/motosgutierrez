    <!-- Marca que hay JavaScript (activa las animaciones de scroll) y abre siempre arriba
         al volver a entrar. Si el JS de la página no llega a cargar, a los 3 s se
         muestra todo igual para que nunca quede contenido escondido. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        setTimeout(function () {
          if (!window.__revealReady) root.classList.remove('js');
        }, 3000);
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        if (location.hash && nav && nav.type !== 'navigate') {
          history.replaceState(null, '', location.pathname + location.search);
        }
        window.addEventListener('pageshow', function (e) {
          if (!e.persisted) return;
          if (location.hash) history.replaceState(null, '', location.pathname + location.search);
          window.scrollTo({ top: 0, behavior: 'instant' });
        });
      })();
    </script>
